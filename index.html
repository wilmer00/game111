<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070817">
<title>NEON VOID — Ultimate Space Combat</title>
<style>
:root{--bg:#070817;--cyan:#4df7ff;--violet:#a66bff;--pink:#ff4dc4;--gold:#ffc66d;--panel:rgba(12,17,43,.88)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}
button,input{font:inherit}button{color:#effaff;cursor:pointer;border:1px solid rgba(105,236,255,.42);background:linear-gradient(135deg,rgba(28,48,91,.94),rgba(22,17,57,.94));padding:.75rem 1.05rem;border-radius:10px;letter-spacing:.08em;font-weight:800;font-size:.78rem;box-shadow:0 0 22px #1a5d8c22,inset 0 0 16px #52eaff0c;transition:transform .15s,border-color .15s,filter .15s}
button:hover{border-color:var(--cyan);filter:brightness(1.18);transform:translateY(-1px)}button:active{transform:scale(.97)}button.primary{background:linear-gradient(110deg,#087eaa,#6240b6);border-color:#8afaff;box-shadow:0 0 28px #22d9ff38}button.danger{border-color:#ff609b66;background:#411b3c}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#10183b 0,#070817 65%)}canvas{display:block;width:100%;height:100%;outline:none}
#topbrand{position:absolute;top:max(12px,env(safe-area-inset-top));left:18px;pointer-events:none;text-shadow:0 0 18px #43eaff70;z-index:2}#topbrand b{font-size:clamp(14px,2vw,22px);letter-spacing:.24em}#topbrand small{display:block;color:#93a9d8;font-size:9px;letter-spacing:.26em;margin-top:2px}
#hud{position:absolute;inset:0;pointer-events:none;display:none;font-size:12px;letter-spacing:.08em;text-shadow:0 1px 5px #000}
.hudbox{position:absolute;padding:9px 12px;border:1px solid #60dffb38;background:linear-gradient(120deg,#101832d9,#11112bd9);border-radius:8px;min-width:110px;box-shadow:0 0 18px #05c9ff10}
#hudScore{top:16px;left:50%;transform:translateX(-50%);text-align:center;min-width:140px}#hudStats{top:16px;right:16px;text-align:right}#hudLife{top:16px;left:16px;min-width:140px}#bossbar{display:none;position:absolute;top:74px;left:20%;width:60%;text-align:center}#bossbar .track{height:7px;border:1px solid #ff6bd8;border-radius:8px;background:#250f31;margin-top:5px;overflow:hidden}#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff3f9c,#ffb05c);box-shadow:0 0 12px #ff3baf}
.meter{height:5px;background:#20294a;border-radius:6px;margin-top:5px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#3ef7ff,#a46dff);width:100%}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(180deg,#03051320,#03051378);z-index:5}
.panel{width:min(600px,94vw);max-height:92dvh;overflow:auto;padding:clamp(20px,4vw,38px);border:1px solid #6ceaff5c;border-radius:20px;background:linear-gradient(145deg,rgba(12,22,53,.96),rgba(10,8,32,.96));box-shadow:0 0 70px #00d9ff19,inset 0 0 40px #7d53ff0a;backdrop-filter:blur(14px);text-align:center}
.eyebrow{font-size:10px;letter-spacing:.34em;color:var(--cyan);font-weight:900}.logo{font-size:clamp(38px,9vw,76px);font-weight:1000;line-height:1;letter-spacing:.11em;margin:12px 0 6px;background:linear-gradient(90deg,#e8ffff,#5cecff 35%,#bd8bff 72%,#ff77d7);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #47eaff39)}.subtitle{font-size:clamp(10px,2vw,13px);letter-spacing:.3em;color:#b5c5ed;margin-bottom:20px}
.panel p{color:#aab8dc;font-size:14px;line-height:1.65}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}.buttons button{min-width:145px}.tiny{font-size:10px!important;color:#7284b5!important;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{padding:12px 6px;background:#111a39;border:1px solid #526cb333;border-radius:10px}.stat b{display:block;font-size:20px;color:#e9fcff}.stat span{font-size:9px;letter-spacing:.12em;color:#8497c7}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;margin:13px 0;color:#dceaff;font-size:13px}.setting input[type=range]{width:45%;accent-color:#4df7ff}.list{display:grid;gap:8px;text-align:left;margin-top:14px}.item{padding:12px;background:#101832;border:1px solid #536f9a44;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item small{display:block;color:#8fa1cc;margin-top:4px}.item button{white-space:nowrap;padding:9px 12px}
#rotate{display:none;position:absolute;inset:0;z-index:10;background:radial-gradient(ellipse,#151d48,#050611);align-items:center;justify-content:center;text-align:center;padding:25px}#rotate .roticon{font-size:70px;display:block;animation:turn 2.2s ease-in-out infinite}@keyframes turn{0%,15%{transform:rotate(0)}65%,85%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}#rotate h2{letter-spacing:.12em;color:#78f5ff}#rotate p{color:#aab8dc}
#touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:3}#stickBase{position:absolute;left:24px;bottom:24px;width:112px;height:112px;border:1px solid #7deeff66;border-radius:50%;background:#11224a70;pointer-events:auto;touch-action:none}#stick{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#63f6ffb8,#8e68ffb8);border:1px solid #c1ffff;box-shadow:0 0 22px #40eaff5c;pointer-events:none}#actions{position:absolute;right:18px;bottom:20px;display:flex;gap:10px;align-items:end;pointer-events:auto}#actions button{width:64px;height:64px;padding:0;border-radius:50%;font-size:10px;letter-spacing:0;background:#121e44d9;touch-action:none}#actions #fireBtn{width:82px;height:82px;border-color:#5dfaff;background:radial-gradient(circle,#1c7590,#182051);box-shadow:0 0 25px #35dfff3b}#actions button.ready{border-color:#ff7bd7;box-shadow:0 0 18px #ff4dc466}
#pauseMini{position:absolute;right:16px;top:75px;pointer-events:auto;display:none;padding:8px 12px;z-index:4}
@media(orientation:portrait) and (max-width:900px){#rotate{display:flex}#overlay,#hud,#touch,#pauseMini{visibility:hidden}}
@media(max-width:600px){#topbrand{top:8px;left:10px}#topbrand small{font-size:7px}#hudLife{top:8px;left:8px;min-width:100px;padding:7px}#hudStats{top:8px;right:8px;padding:7px}#hudScore{top:8px;padding:7px;min-width:105px}#bossbar{top:57px}.panel{padding:20px 16px}.panel p{font-size:12px}.buttons button{min-width:125px;padding:.7rem .7rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="Campo de combate espacial"></canvas>
<div id="topbrand"><b>NEON VOID</b><small>ULTIMATE SPACE COMBAT</small></div>
<div id="hud">
 <div id="hudLife" class="hudbox">CASCO <b id="lifeText">100</b>%<div class="meter"><span id="lifeFill"></span></div>ESCUDO <b id="shieldText">50</b><div class="meter"><span id="shieldFill"></span></div></div>
 <div id="hudScore" class="hudbox"><b id="scoreText">000000</b><div style="color:#9caed8;margin-top:3px">SECTOR <span id="sectorText">01</span> · OLEADA <span id="waveText">01</span></div></div>
 <div id="hudStats" class="hudbox">CRÉDITOS <b id="creditText">0</b><br><span style="color:#a6b8df">MULTIPLICADOR ×<b id="multiText">1</b></span></div>
 <div id="bossbar"><b id="bossName">GUARDIÁN</b><div class="track"><div id="bossFill"></div></div></div>
</div>
<button id="pauseMini">Ⅱ PAUSA</button>
<div id="touch"><div id="stickBase"><div id="stick"></div></div><div id="actions"><button id="boostBtn">IMPULSO</button><button id="shieldBtn">ESCUDO</button><button id="fireBtn">DISPARAR</button></div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="rotate"><div><span class="roticon">▱</span><h2>GIRA TU DISPOSITIVO</h2><p>NEON VOID requiere orientación horizontal para iniciar el combate.</p></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id), overlay=$('overlay'),panel=$('panel'),hud=$('hud'),touchUI=$('touch');
let W=960,H=540,dpr=1,last=0,acc=0,screen='menu',paused=false,gameOver=false,portrait=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const store={get(k,f){try{let v=localStorage.getItem('nv_'+k);return v===null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem('nv_'+k,JSON.stringify(v))}catch(e){}}};
let settings=store.get('settings',{sound:true,music:.18,sfx:.45,fx:1,reduced:false});
let save=store.get('save',{best:0,credits:0,upgrades:{weapon:0,engine:0,shield:0},achievements:[],games:0,bosses:0});
let audio=null,musicTimer=null,musicStep=0;
function audioInit(){if(audio)return;try{audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){audio=null}}
function tone(freq=440,dur=.1,type='sine',vol=.15,slide=0){if(!settings.sound||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(Math.max(.001,vol*settings.sfx),audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02)}catch(e){}}
function sfx(kind){if(!settings.sound)return;({click:()=>tone(560,.045,'sine',.13,180),shoot:()=>tone(520,.07,'sawtooth',.08,-290),hit:()=>tone(160,.12,'square',.12,-70),boom:()=>{tone(90,.3,'sawtooth',.2,-65);tone(240,.14,'triangle',.12,-180)},pickup:()=>{tone(650,.1,'sine',.14,240);setTimeout(()=>tone(900,.12,'sine',.1,150),60)},shield:()=>tone(300,.25,'sine',.16,600),boss:()=>{tone(95,.55,'sawtooth',.15,-45);tone(145,.4,'triangle',.12,-50)},win:()=>{tone(500,.18,'triangle',.15,300);setTimeout(()=>tone(760,.25,'sine',.12,350),130)},damage:()=>tone(120,.24,'square',.16,-70)})[kind]?.()}
function musicStart(){if(!audio||!settings.sound||musicTimer)return;const seq=[110,164.8,220,164.8,130.8,196,261.6,196];musicTimer=setInterval(()=>{if(!audio||!settings.sound||paused||screen!=='play')return;let f=seq[musicStep++%seq.length];try{let o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type='triangle';o.frequency.value=f;filter.type='lowpass';filter.frequency.value=650;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.linearRampToValueAtTime(settings.music*.12,audio.currentTime+.06);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.42);o.connect(filter);filter.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.44)}catch(e){}},430)}
function musicStop(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
let stars=[],particles=[],bullets=[],enemyBullets=[],enemies=[],drops=[],floaters=[],boss=null;
let player=null,score=0,credits=0,wave=1,sector=1,kills=0,runTime=0,spawnClock=0,intermission=0,combo=1,comboTime=0,shake=0,flash=0;
const keys=new Set(),touch={x:0,y:0,fire:false,boost:false,shield:false},pointer={x:0,y:0,down:false};
function resize(){let rect=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,1.8);W=Math.max(320,rect.width);H=Math.max(240,rect.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);portrait=matchMedia('(orientation: portrait)').matches&&W<900;stars=Array.from({length:Math.min(180,Math.floor(W*H/3000))},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.3,1.8),r:rand(.4,1.6),a:rand(.2,.9)}));if(player){player.x=clamp(player.x,20,W-20);player.y=clamp(player.y,25,H-25)}}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>{resize();if(portrait&&screen==='play')paused=true});resize();
function drawBackground(dt){ctx.fillStyle='#060817';ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(W*.48,H*.42,0,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,'#141b43');g.addColorStop(.55,'#0a0d25');g.addColorStop(1,'#040510');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){s.y+=s.z*dt*23;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.globalAlpha=s.a;ctx.fillStyle=s.z>1.3?'#a9faff':'#7387c9';ctx.fillRect(s.x,s.y,s.r,s.r);if(s.z>1.5){ctx.strokeStyle='#54e9ff55';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y-5*s.z);ctx.stroke()}}ctx.globalAlpha=1;
ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#3f8ebd';ctx.lineWidth=1;let grid=54,offset=(runTime*14)%grid;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-grid;y<H+grid;y+=grid){ctx.beginPath();ctx.moveTo(0,y+offset);ctx.lineTo(W,y+offset);ctx.stroke()}ctx.restore()}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawShip(x,y,scale=1,angle=0,enemy=false,hp=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.shadowBlur=18;ctx.shadowColor=enemy?'#ff4dc4':'#3df7ff';
if(!enemy){let flame=rand(13,21);ctx.fillStyle='#4df7ff';poly([[-7,15],[-3,15],[0,15+flame], [3,15], [7,15],[0,23+flame*.35]],'#32dfffa8');poly([[-19,5],[-12,-8],[-5,-13],[0,-23],[8,-12],[17,-4],[22,8],[8,5],[3,14],[-7,13],[-12,5]],'#183b70','#83f9ff');poly([[-10,1],[-3,-11],[1,-17],[8,-4],[13,2],[4,7],[-5,7]],'#6bf4ff','#e2ffff');poly([[-7,-1],[0,-12],[6,-1],[0,4]],'#1a2c5c','#b4a5ff');ctx.fillStyle='#ff7bd9';ctx.fillRect(-15,2,4,3);ctx.fillRect(11,2,4,3);ctx.shadowBlur=0;ctx.strokeStyle='#7cfaff88';ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(-17,4);ctx.moveTo(7,-8);ctx.lineTo(15,3);ctx.stroke();}
else{ctx.rotate(Math.PI);ctx.fillStyle='#ff4dc4';poly([[-23,-5],[-12,-13],[-8,-4],[0,-17],[8,-4],[15,-11],[24,-2],[14,9],[4,7],[0,17],[-7,7],[-16,9]],hp>.55?'#782a83':'#9d4d56','#ff91dd');poly([[-8,-2],[0,-10],[8,-2],[0,7]],'#ffbd72','#fff1ce');ctx.fillStyle='#ffcb73';ctx.fillRect(-16,0,5,3);ctx.fillRect(12,0,5,3)}
ctx.restore()}
function particle(x,y,color,n=10,power=100){if(settings.reduced)n=Math.ceil(n*.4);for(let i=0;i<n&&particles.length<500;i++){let a=Math.random()*Math.PI*2,s=rand(power*.2,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.8),max:.8,size:rand(1,3.5),color})}}
function burstText(x,y,text,color='#7df8ff'){floaters.push({x,y,text,color,life:1})}
function newPlayer(){return{x:W*.5,y:H*.76,vx:0,vy:0,r:14,hp:100,shield:50,invuln:0,weapon:1+save.upgrades.weapon,engine:1+save.upgrades.engine,shieldLevel:save.upgrades.shield,shot:0,boost:0,shieldCd:0,special:2,angle:0}}
function resetGame(){audioInit();musicStart();player=newPlayer();score=0;credits=0;wave=1;sector=1;kills=0;runTime=0;spawnClock=.7;intermission=0;combo=1;comboTime=0;shake=0;flash=0;particles=[];bullets=[];enemyBullets=[];enemies=[];drops=[];floaters=[];boss=null;gameOver=false;paused=false;screen='play';overlay.style.display='none';hud.style.display='block';touchUI.style.display='block';$('pauseMini').style.display='block';updateHud();sfx('win')}
function updateHud(){$('lifeText').textContent=Math.ceil(player?.hp||0);$('lifeFill').style.width=clamp(player?.hp||0,0,100)+'%';$('shieldText').textContent=Math.ceil(player?.shield||0);$('shieldFill').style.width=clamp((player?.shield||0)*2,0,100)+'%';$('scoreText').textContent=String(score).padStart(6,'0');$('sectorText').textContent=String(sector).padStart(2,'0');$('waveText').textContent=String(wave).padStart(2,'0');$('creditText').textContent=credits;$('multiText').textContent=combo;$('bossbar').style.display=boss?'block':'none';if(boss)$('bossFill').style.width=clamp(boss.hp/boss.max,0,1)*100+'%';}
function spawnEnemy(){if(enemies.length>13)return;let type;let r=Math.random();if(wave<2)type=r<.7?'scout':'zigzag';else type=r<.32?'scout':r<.55?'zigzag':r<.76?'hunter':r<.92?'tank':'sniper';let hp=type==='tank'?5+sector:type==='sniper'?3: type==='hunter'?3:2;enemies.push({x:rand(35,W-35),y:-35,vx:rand(-30,30),vy:rand(35,75)+wave*3,r:type==='tank'?22:15,hp,max:hp,type,age:0,shot:rand(1.1,2.5),phase:rand(0,6),score:type==='tank'?180:100})}
function spawnBoss(){boss={x:W/2,y:-90,targetY:Math.max(90,H*.2),hp:90+sector*35,max:90+sector*35,r:42,age:0,shot:.8,phase:1,enter:true};sfx('boss');burstText(W/2,H*.36,'⚠ GUARDIÁN DE SECTOR ⚠','#ff8ee5')}
function firePlayer(){if(!player||player.shot>0)return;let spread=player.weapon>=3?[-.16,0,.16]:player.weapon===2?[-.07,.07]:[0];for(const a of spread){bullets.push({x:player.x+Math.sin(a)*8,y:player.y-20,vx:Math.sin(a)*90,vy:-510,r:4,damage:1+save.upgrades.weapon*.55});}player.shot=Math.max(.09,.19-player.weapon*.018);particle(player.x,player.y-20,'#62faff',3,45);sfx('shoot')}
function enemyFire(e){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1,speed=170+wave*6;if(e.type==='sniper'){for(let k=-1;k<=1;k++){let a=Math.atan2(dy,dx)+k*.18;enemyBullets.push({x:e.x,y:e.y+10,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:5,damage:9,color:'#ffb26b'})}}else if(e.type==='tank'){for(let k=-2;k<=2;k++){let a=Math.atan2(dy,dx)+k*.24;enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*speed*.75,vy:Math.sin(a)*speed*.75,r:5,damage:8,color:'#ff5ec9'})}}else enemyBullets.push({x:e.x,y:e.y+8,vx:dx/d*speed,vy:dy/d*speed,r:4,damage:7,color:'#ff64c9'})}
function damagePlayer(amount){if(player.invuln>0)return;if(player.shield>0){let absorbed=Math.min(player.shield,amount);player.shield-=absorbed;amount-=absorbed*.25}if(amount>0)player.hp-=amount;player.invuln=.55;shake=7;flash=.22;sfx('damage');particle(player.x,player.y,'#ff619e',15,160);if(player.hp<=0)endGame(false)}
function destroyEnemy(e){score+=e.score*combo;kills++;combo=clamp(combo+1,1,8);comboTime=2.2;credits+=e.type==='tank'?4:2;particle(e.x,e.y,e.type==='tank'?'#ffad70':'#ff5dc8',18,170);sfx('boom');if(Math.random()<.19)dropItem(e.x,e.y);if(kills%10===0){player.hp=clamp(player.hp+8,0,100);player.shield=clamp(player.shield+8,0,100);burstText(player.x,player.y-35,'CASCO +8','#70ffce')}}
function dropItem(x,y){let type=['heal','shield','weapon','triple','bomb','score'][Math.floor(Math.random()*6)];drops.push({x,y,vy:55,r:11,type,age:0})}
function collect(d){switch(d.type){case'heal':player.hp=clamp(player.hp+25,0,100);break;case'shield':player.shield=clamp(player.shield+35,0,100);break;case'weapon':player.weapon=Math.min(4,player.weapon+1);break;case'triple':player.weapon=Math.min(4,player.weapon+1);player.special=Math.min(3,player.special+1);break;case'bomb':for(const e of enemies.slice())destroyEnemy(e);enemies=[];enemyBullets=[];if(boss)boss.hp-=25;particle(player.x,player.y,'#c77aff',45,250);break;case'score':score+=500*combo;break}credits+=1;sfx('pickup');burstText(d.x,d.y-14,({heal:'CASCO +',shield:'ESCUDO +',weapon:'ARMA ↑',triple:'ENERGÍA +',bomb:'BOMBA',score:'BONUS 500'})[d.type], '#7df8ff')}
function activateShield(){if(!player||player.shieldCd>0)return;player.shieldCd=5;player.shield=clamp(player.shield+18,0,100);player.invuln=Math.max(player.invuln,.8);particle(player.x,player.y,'#68faff',25,140);sfx('shield');burstText(player.x,player.y-30,'ESCUDO ACTIVO')}

function bindHold(id,prop){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();el.setPointerCapture?.(e.pointerId);touch[prop]=true;if(prop!=='fire'){setTimeout(()=>{touch[prop]=false},50)}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(prop==='fire')touch.fire=false;else touch[prop]=false})}
bindHold('fireBtn','fire');bindHold('boostBtn','boost');bindHold('shieldBtn','shield');
document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();pointer.down=false;touch.fire=false;if(screen==='play')paused=true}});
menu();
})();
